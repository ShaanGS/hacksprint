# Lint, typecheck and unit tests on every push and pull request. Needs no secrets: typecheck
# skips the env check, and unit tests set their own env. Smoke and e2e tests need real keys, so
# they run locally.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # Installs the pnpm version pinned in package.json (packageManager) and caches its store.
      - uses: pnpm/action-setup@v6
        with:
          cache: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
